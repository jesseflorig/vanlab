---
apiVersion: v1
kind: Service
metadata:
  name: loki-nvr-push
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: single-binary
    app.kubernetes.io/instance: loki
    app.kubernetes.io/name: loki
  ports:
    - name: http-push
      port: 3100
      targetPort: 3100
      nodePort: 30100
      protocol: TCP
