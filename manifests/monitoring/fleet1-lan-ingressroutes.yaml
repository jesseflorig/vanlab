---
# Traefik IngressRoute: grafana.fleet1.lan
# TLS cert provided by fleet1-lan-wildcard-tls TLSStore (SNI-selected).
# TODO: add mTLS enforcement once device-mtls TLSOption + device-ca-public secret
# are mirrored into the monitoring namespace (per frigate pattern).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-fleet1-lan
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - match: Host(`grafana.fleet1.lan`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
---
# Traefik IngressRoute: prometheus.fleet1.lan (spec 065)
# Split rules: scrape/API paths (priority 20, no auth) bypass forward-auth so
# Prometheus can still scrape itself. Browser paths (priority 10) require login.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus-fleet1-lan
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - match: Host(`prometheus.fleet1.lan`) && (PathPrefix(`/metrics`) || PathPrefix(`/api/v1/`))
      kind: Rule
      priority: 20
      services:
        - name: kube-prometheus-stack-prometheus
          port: 9090
    - match: Host(`prometheus.fleet1.lan`)
      kind: Rule
      priority: 10
      middlewares:
        - name: authentik-forward-auth
          namespace: traefik
      services:
        - name: kube-prometheus-stack-prometheus
          port: 9090
---
# Traefik IngressRoute: alertmanager.fleet1.lan (spec 065)
# Split rules: scrape/API paths (priority 20, no auth) bypass forward-auth so
# Prometheus can scrape Alertmanager. Browser paths (priority 10) require login.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: alertmanager-fleet1-lan
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - match: Host(`alertmanager.fleet1.lan`) && (PathPrefix(`/metrics`) || PathPrefix(`/api/v2/`))
      kind: Rule
      priority: 20
      services:
        - name: kube-prometheus-stack-alertmanager
          port: 9093
    - match: Host(`alertmanager.fleet1.lan`)
      kind: Rule
      priority: 10
      middlewares:
        - name: authentik-forward-auth
          namespace: traefik
      services:
        - name: kube-prometheus-stack-alertmanager
          port: 9093
---
# Traefik IngressRoute: loki.fleet1.lan (spec 065)
# No scrape exemption needed — Grafana uses in-cluster URL directly.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: loki-fleet1-lan
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - match: Host(`loki.fleet1.lan`)
      kind: Rule
      middlewares:
        - name: authentik-forward-auth
          namespace: traefik
      services:
        - name: loki
          port: 3100
