---
# Traefik IngressRoute: frigate.fleet1.lan — HTTPS via fleet1-lan wildcard cert.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frigate-fleet1-lan
  namespace: frigate
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - match: Host(`frigate.fleet1.lan`)
      kind: Rule
      services:
        - name: frigate
          port: 5000
