---
# Authentik Helm values — goauthentik/authentik chart v2026.5.0
#
# Key decisions (see specs/063-authentik-idp/research.md for full rationale):
#   - authentik.existingSecret.secretName: secrets are injected via envFrom (not inline values)
#   - postgresql.auth.existingSecret: same SealedSecret serves both consumers
#   - No Redis/Valkey: Authentik 2026.5.x uses django-postgres-cache (PostgreSQL-backed)
#   - ingress.enabled: false — Traefik IngressRoute in prereqs/ handles routing
#
# Secret values are NEVER stored here — all secrets via SealedSecret `authentik-secrets`.

authentik:
  existingSecret:
    secretName: authentik-secrets

# When existingSecret.secretName is set, all authentik.* values are bypassed (chart uses envFrom).
# Non-secret config that would normally come from authentik.* must be set here via global.env.
global:
  env:
    - name: AUTHENTIK_POSTGRESQL__HOST
      value: authentik-postgresql
    - name: AUTHENTIK_POSTGRESQL__NAME
      value: authentik
    - name: AUTHENTIK_POSTGRESQL__USER
      value: authentik
    - name: AUTHENTIK_POSTGRESQL__PORT
      value: "5432"

postgresql:
  enabled: true
  auth:
    existingSecret: authentik-secrets
    username: authentik
    database: authentik
  primary:
    persistence:
      enabled: true
      storageClass: longhorn
      size: 10Gi

server:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      labels:
        release: prometheus

worker:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      labels:
        release: prometheus

# ingress: key removed — deprecated in 2026.5.0 (triggers template error if present)
# Routing handled by Traefik IngressRoute in manifests/authentik/prereqs/ingress-route.yaml
