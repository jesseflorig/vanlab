---
# Traefik IngressRoute: vault.fleet1.lan — Vaultwarden web UI.
# Standard TLS via TLSStore (SNI-selected wildcard cert) — NO device-mTLS.
# Vaultwarden is the recovery toolchain for device certs; adding device-mTLS
# creates a circular dependency where losing the device cert locks you out of
# the vault that stores the recovery path.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - match: Host(`vault.fleet1.lan`)
      kind: Rule
      services:
        - name: vaultwarden
          port: 80
